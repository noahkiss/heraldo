        $ref: "#/components/requestBodies/PingLog"
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /p/{key}/{exit_code}:
    parameters:
      - $ref: "#/components/parameters/PingKeyPath"
      - name: exit_code
        in: path
        required: true
        description: The job's exit code. 0 records success, anything else records a failure.
        schema:
          type: integer
          minimum: 0
          maximum: 255
      - $ref: "#/components/parameters/Rid"
      - $ref: "#/components/parameters/PingSource"
      - $ref: "#/components/parameters/PingHost"
      - $ref: "#/components/parameters/PingProject"
    get:
      operationId: keyPingExitCode
      summary: Record a run by its exit code.
      tags: [checkins]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: keyPingExitCodeWithLog
      summary: Record a run by its exit code, with a log in the body.
      tags: [checkins]
      security: []
      requestBody:
        $ref: "#/components/requestBodies/PingLog"
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects:
    get:
      operationId: listProjects
      summary: The projects the stored events name, with their event counts.
      description: |
        A name the rules file's aliases map to another counts under that other name.
        unfiled counts the events with no project.
      tags: [events]
      responses:
        "200":
          description: The projects, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/checkins:
    get:
      operationId: listCheckins
      summary: Every check with its schedule, state, next due time, last duration and last log.
      tags: [checkins]
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
      responses:
        "200":
          description: The checks, in key order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/checkins/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getCheckin
      summary: One check.
      tags: [checkins]
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putCheckin
      summary: Create a check, or replace a known check's host and schedule.
      description: |
        Every field is replaced: a field left out takes its default. A changed schedule
        moves the next due time from the last run, and a check that is late or down for
        a missed ping is judged again under the new schedule.
      tags: [checkins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckConfig"
      responses:
        "200":
          description: The check, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "201":
          description: The check, created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/checkins/{slug}/pause:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: pauseCheckin
      summary: Stop judging a check. Pings are still recorded; an open incident resolves.
      tags: [checkins]
      responses:
        "200":
          description: The check, paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/checkins/{slug}/key:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: mintPingKey
      summary: Mint the check's ping key, replacing the old one.
      description: |
        The answer is the only time the server shows the key; it stores the SHA-256.
        The key in /p/{key} pings this one check and does nothing else.
      tags: [checkins]
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingKey"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removePingKey
      summary: Remove the check's ping key. /p/ pings with it get 404.
      tags: [checkins]
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/checkins/{slug}/resume:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: resumeCheckin
      summary: Judge a paused check again. It is new, due at its first slot after the resume.
      tags: [checkins]
      responses:
        "200":
          description: The check, resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /notify/{key}:
    post:
      operationId: notifyAppriseKey
      summary: Apprise-compatible ingest.
      description: |
        Takes an Apprise API notify request (JSON, form or multipart; files are
        dropped) and stores it as an untyped event, so the ingest rules type it.
        `key` is Apprise's config key: `apprise`, or a token with the notify-key
        capability, which is then the credential. Without a bearer token or a
        notify-key token, a client in HERALDO_NOTIFY_TRUSTED_NETS may post. An
        alert-rung post may be held (see the hold paths). Answers 200 with a
        detail line containing "Sent", or 424 when the event was not stored.
        docs/api.md, "Apprise compatibility".
      tags: [compat]
      security: [{bearerAuth: []}, {}]
      parameters:
        - name: key
          in: path
          required: true
          description: The Apprise config key, or a notify-key token.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/AppriseNotify"
      responses:
        "200":
          $ref: "#/components/responses/AppriseSent"
        "400":
          $ref: "#/components/responses/AppriseAnswer"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "424":
          $ref: "#/components/responses/AppriseAnswer"
  /v1/notify:
    post:
      operationId: notifyMessage
      summary: Apprise-compatible ingest with the outcome.
      description: |
        The same message as /notify/{key}, `body` required. The answer adds `id`
        (the event), `delivered` (false when held), `backends` and `hold_id`.
      tags: [compat]
      security: [{bearerAuth: []}, {}]
      requestBody:
        $ref: "#/components/requestBodies/AppriseNotify"
      responses:
        "200":
          $ref: "#/components/responses/AppriseSent"
        "400":
          $ref: "#/components/responses/AppriseAnswer"
        "401":
          $ref: "#/components/responses/Error"
        "424":
          $ref: "#/components/responses/AppriseAnswer"
  /recent:
    get:
      operationId: notifyRecent
      summary: The newest events in the apprise-tee catalogue's shape.
      description: |
        The newest n events, newest last, as apprise-tee's /recent gave them.
        `tag=none` keeps untagged events; `source` matches exactly or by the part
        before "/", ignoring case. `routine=exclude` leaves routine events out
        (passing check-in pings, progress, status) and `only` keeps only them, as on
        GET /v1/events; without it the list holds both. The answer then carries a
        Heraldo-Routine header. A read token, or a trusted network.
      tags: [compat]
      security: [{bearerAuth: []}, {}]
      parameters:
        - {name: n, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 50}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: routine, in: query, schema: {type: string, enum: [exclude, only]}}
      responses:
        "200":
          description: Catalogue entries, newest last.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
  /entry/{id}:
    get:
      operationId: notifyEntry
      summary: One event in the catalogue's shape.
      tags: [compat]
      security: [{bearerAuth: []}, {}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/Error"
  /v1/hold:
    get:
      operationId: holdList
      summary: The alert hold's queue.
      description: |
        Open entries, and entries closed in the last 24 hours (`state=pending`:
        open only). Every call without `peek=1` is a triage poll and resets the
        dead-man. Also served as GET /held. docs/api.md, "Hold".
      tags: [hold]
      security: [{bearerAuth: []}, {}]
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [pending]}}
        - {name: peek, in: query, schema: {type: string, enum: ["1", "true", "yes"]}}
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldQueue"
        "401":
          $ref: "#/components/responses/Error"
  /v1/hold/release:
    post:
      operationId: holdRelease
      summary: Close held entries with one message.
      description: |
        In mode on, stores one message at `tag` from source `triage`; in shadow it
        only records. 409 when no id names an open entry. Also POST /held/release.
      tags: [hold]
      security: [{bearerAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, verdict, title, body, tag]
              properties:
                ids: {type: array, minItems: 1, items: {type: string}}
                verdict: {type: string, enum: [REAL, BLIP, MAINTENANCE, FALSE]}
                title: {type: string}
                body: {type: string}
                tag: {type: string}
      responses:
        "200":
          description: Closed. `released`, `unknown_or_closed`, `mode`, `sent`, `event_id`.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: No open entry among ids.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /v1/hold/suppress:
    post:
      operationId: holdSuppress
      summary: Close held entries and send nothing.
      description: 409 when no id names an open entry. Also POST /held/suppress.
      tags: [hold]
      security: [{bearerAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, items: {type: string}}
                reason: {type: string}
      responses:
        "200":
          description: Closed. `suppressed`, `unknown_or_closed`, `mode`.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: No open entry among ids.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /v1/settings:
    get:
      operationId: listSettings
      summary: Every known setting, with its value and where it comes from. Needs a read token.
      description: |
        One precedence order, highest first: a heraldo-server launch flag, an env var,
        a value stored through this API, the built-in default. source says which one
        is in force. A secret reports only set, never its value.
      tags: [settings]
      responses:
        "200":
          description: The settings, by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: A known key, such as quiet.enabled. GET /v1/settings lists them.
        schema:
          type: string
    get:
      operationId: getSetting
      summary: One setting. Needs a read token.
      tags: [settings]
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putSetting
      summary: Store a setting's value. Needs an admin token.
      description: |
        value has the key's JSON type: a bool, a whole number, a string, or an array
        of strings; a duration is a string such as "72h". The new value takes effect
        without a restart. A secret is stored encrypted with the key in
        HERALDO_SECRET_KEY_FILE; a server without that file answers 409
        no_secret_key. A key a flag or env var sets answers 409 locked_by_env.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "200":
          description: The setting after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/SettingConflict"
    delete:
      operationId: deleteSetting
      summary: Remove a setting's stored value, back to its default. Needs an admin token.
      description: A key with no stored value answers 200 as it is. A key a flag or env var sets answers 409 locked_by_env.
      tags: [settings]
      responses:
        "200":
          description: The setting after the delete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/SettingConflict"
  /v1/guidance:
    get:
      operationId: listGuidance
      summary: Every guidance line, oldest first. Needs a read token.
      description: |
        Guidance is free text that informs the LLM's wording and grouping. It never
        sets a floor, raises a level or overrides an ingest rule.
      tags: [llm]
      parameters:
        - name: scope
          in: query
          description: Only lines with exactly this scope.
          schema:
            type: string
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidanceList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createGuidance
      summary: Add a guidance line. Needs a write token.
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuidanceInput"
      responses:
        "201":
          description: The line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guidance"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/guidance/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The line's id, gd_ plus a ULID.
        schema:
          type: string
    get:
      operationId: getGuidance
      summary: One guidance line.
      tags: [llm]
      responses:
        "200":
          description: The line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guidance"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putGuidance
      summary: Replace a guidance line. Needs a write token.
      description: The version goes up by one. A field left out keeps its value.
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuidancePatch"
      responses:
        "200":
          description: The line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guidance"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGuidance
      summary: Delete a guidance line. Needs a write token.
      tags: [llm]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/llm/status:
    get:
      operationId: llmStatus
      summary: The LLM's mode, effective mode, circuit, budget and last error. Needs a read token.
      tags: [llm]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmStatus"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/llm/test:
    post:
      operationId: llmTest
      summary: Ask the provider a trivial question. Needs an admin token.
      description: |
        Runs with llm.mode off too, so an operator can check the endpoint before
        turning it on. The call counts against the budgets and is logged. Never on a
        standby.
      tags: [llm]
      responses:
        "200":
          description: The provider answered, or the reason it did not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/ask:
    post:
      operationId: ask
      summary: Ask the chat model about the stored events. Needs a read token.
      description: |
        Needs llm.chat on and llm.mode not off; otherwise 409. The server runs read-only
        tools for the model (events_search, event_read, overview, checkin_read). Chat
        never writes: a proposal is applied by the client with an ordinary write call.
        Never on a standby (409).
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/mcp:
    post:
      operationId: mcp
      summary: The MCP tools, over streamable HTTP.
      description: |
        Served only with HERALDO_MCP_HTTP=on; otherwise 404. One JSON-RPC message per
        POST, answered as JSON. Stateless: no Mcp-Session-Id, and GET and DELETE get 405.
        A read token gets the read tools. A write or admin token gets the write tools
        too, and its tools may also read. The tools are the ones `heraldo mcp` serves on
        stdio; docs/mcp.md lists them. A token with the notify-key or trusted-ingest
        capability gets 403.
      tags: [mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: A JSON-RPC 2.0 message.}
      responses:
        "200":
          description: The JSON-RPC answer.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "202":
          description: A notification or a response from the client; no body.
        "400":
          description: Not a JSON-RPC message.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: HERALDO_MCP_HTTP is off.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        One token per sender for writes, one per client for reads. An app holds a pair: a
        read token (history, cursors, device registration) and a write token (notification
        actions, sending). Each token has a
        scope: write (POST /v1/events, GET /v1/send, /v1/mutes), read
        (GET /v1/events, /v1/events/{id}, /v1/state, /v1/stream, the read cursors,
        /v1/devices and GET /v1/icons), or admin (both, and PUT and
        DELETE /v1/icons and /v1/settings/{key}). A missing or unknown token gets 401; a token without the
        scope gets 403.

        A write token can carry the trusted-ingest capability, for a bridge such as
        apprise-tee. The server copies its details.tee.hold object into hold, and
        marks it store_only only when it is state held and not forwarded. It matches
        its dedup ids at any age instead of the last 24 hours.
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: |
        The same token as bearerAuth, in the URL, for GET-only clients. The URL ends up
        in access logs, proxy logs and browser history, so the token does too. Use the
        Authorization header when the client can set one.
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: "The check's name, the same as the checkin key: 1 to 200 of A-Z a-z 0-9 and . _ : -"
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,200}$"
    Rid:
      name: rid
      in: query
      description: Run id. Pairs a start with its end.
      schema:
        type: string
    Create:
      name: create
      in: query
      description: |
        Set to 1 to create the check when the server does not know the slug. A new check
        takes its schedule from period, cron, tz, grace, max_runtime and reminder: seconds,
        or a Go duration such as 1h30m. These parameters are ignored for a known check.
      schema:
        type: integer
        enum: [0, 1]
    PingKeyPath:
      name: key
      in: path
      required: true
      description: A check's ping key, from POST /v1/checkins/{slug}/key. 32 characters, base64url.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{32}$"
    PingSource:
      name: source
      in: query
      description: The event's source. Default checkin.
      schema:
        type: string
        maxLength: 128
    PingHost:
      name: host
      in: query
      description: The event's host, and the host of a check that this ping creates.
      schema:
        type: string
        maxLength: 128
    PingProject:
      name: project
      in: query
      description: The event's project. Without one, the check keeps the project of its earlier pings.
      schema:
        type: string
        maxLength: 64
    ProjectFilter:
      name: project
      in: query
      description: |
        Only these projects. Give a comma-separated list, or repeat the parameter; any
        one name matches. - matches items with no project. A name also matches the
        names the rules file's aliases map to it. Upper case folds to lower case.
      explode: true
      schema:
        type: array
        items:
          type: string
  requestBodies:
    PingLog:
      description: Log text for the run, stored as the event's body. The server keeps the first 100 kB.
      content:
        text/plain:
          schema:
            type: string
    AppriseNotify:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppriseNotify"
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/AppriseNotify"
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/AppriseNotify"
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SettingConflict:
      description: The server refused the write. code says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SettingError"
    Stored:
      description: The event was stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Event"
    Repeat:
      description: The dedup id was seen in the last 24 hours. Nothing was stored; this is the first event.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Event"
    PingOK:
      description: The ping was recorded.
      content:
        text/plain:
          schema:
            type: string
            const: OK
    AppriseSent:
      description: The notification was stored, or held for triage. A detail line contains "Sent".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppriseAnswer"
    AppriseAnswer:
      description: Not stored, in Apprise's shape. No detail line contains "Sent".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppriseAnswer"
  schemas:
    EventInput:
      $ref: "envelope.v1.schema.json"
    Event:
      $ref: "envelope.v1.schema.json#/$defs/Event"
    EventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: string
          description: Pass as after to get the next page. Present whenever the page has events; missing on an empty page.
    PushTrace:
      type: object
      description: Why an event did or did not push.
      required: [event_id, decisions]
      properties:
        event_id:
          type: string
        why:
          type: string
          description: The one-line summary, as on the event. Missing when there are no rows.
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/PushDecision"
    PushDecision:
      type: object
      description: One pipeline stage's decision on an event.
      required: [stage, outcome, reason, at]
      properties:
        stage:
          type: string
          description: "The stage, in pipeline order: hold, expiry, table, replace, devices, mute, inhibit, deliver. Rows beside the pipeline follow it: escalate (Pushover) and llm (the LLM's decisions role; its detail has call_id, mode, verdict and applied). Later servers add stages."
        outcome:
          type: string
          enum: [pass, downgrade, delay, merge, drop]
          description: "pass: on to the next stage. downgrade: on, at a lower level. delay: pushes later. merge: joins a bundle. drop: not pushed."
        reason:
          type: string
          description: One line a person reads, such as "muted by mute_... (project)".
        detail:
          type: object
          additionalProperties: true
          description: "Stage data: level, mute, rule and parent, expires_at, or devices (device, outcome, attempts, error) on deliver."
        at:
          type: string
          format: date-time
    DigestPreview:
      type: object
      description: |
        A digest and the schedule around it. Times are RFC 3339 in UTC; the text
        uses tz. The lists hold every item; the body lists at most 10 per section.
      required: [day, tz, since, until, level, title, summary, body, incidents, checkins, finished, held, projects, enabled, at]
      properties:
        day:
          type: string
          description: The local day the digest is for, YYYY-MM-DD in tz.
        tz:
          type: string
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        level:
          type: string
          enum: [passive, active]
          description: active when an incident is open and not acked, or a check is down or late.
        title:
          type: string
        summary:
          type: string
          description: The one-line push text.
        body:
          type: string
          description: The full text, Markdown.
        prose:
          type: string
          description: A summary paragraph from the summary model. Missing without one.
        incidents:
          type: object
          required: [opened, resolved, open, stale]
          properties:
            opened:
              type: integer
              description: Incidents that opened inside the window.
            resolved:
              type: array
              items:
                $ref: "#/components/schemas/DigestIncident"
            open:
              type: array
              description: Not resolved and not stale.
              items:
                $ref: "#/components/schemas/DigestIncident"
            stale:
              type: array
              description: Not resolved, last event older than stale.after. Empty while stale.enabled is off.
              items:
                $ref: "#/components/schemas/DigestIncident"
        checkins:
          type: object
          required: [total, ok, paused, items]
          properties:
            total:
              type: integer
              description: Checks that are not paused.
            ok:
              type: integer
              description: Of those, the ones not down or late.
            paused:
              type: integer
            items:
              type: array
              description: Checks down or late now, or with failed runs inside the window.
              items:
                $ref: "#/components/schemas/DigestCheck"
        finished:
          type: array
          description: Progress keys (jobs, prints) that ended inside the window.
          items:
            $ref: "#/components/schemas/DigestJob"
        held:
          type: object
          required: [open, closed]
          properties:
            open:
              type: array
              description: Entries the hold still keeps back.
              items:
                $ref: "#/components/schemas/DigestHeld"
            closed:
              type: integer
              description: Entries triage closed inside the window.
        projects:
          type: array
          description: Events inside the window per project, routine events left out, most first. name is empty for events with no project.
          items:
            $ref: "#/components/schemas/DigestProject"
        enabled:
          type: boolean
          description: digest.enabled.
        at:
          type: string
          description: digest.at, HH:MM in tz.
        next_at:
          type: string
          format: date-time
          description: When the scheduled digest goes out next. Missing while the digest is off.
        last_sent:
          type: string
          format: date-time
          description: When the last scheduled digest went out.
        event_id:
          type: string
          description: The stored event, on POST /v1/digest/send.
    DigestIncident:
      type: object
      required: [key, state, title, opened_at, last_at, event_id]
      properties:
        key:
          type: string
        state:
          type: string
          enum: [open, acked, resolved]
        title:
          type: string
        source:
          type: string
        project:
          type: string
        level:
          type: string
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
          description: When the incident's last event arrived.
        event_id:
          type: string
          description: The incident's last event.
        new:
          type: boolean
          description: The incident opened inside the window.
    DigestCheck:
      type: object
      required: [key, state, failures]
      properties:
        key:
          type: string
        state:
          type: string
        down_reason:
          type: string
        failures:
          type: integer
          description: Failed runs inside the window.
    DigestJob:
      type: object
      required: [key, title, ended_at, event_id]
      properties:
        key:
          type: string
        title:
          type: string
        project:
          type: string
        ended_at:
          type: string
          format: date-time
        event_id:
          type: string
    DigestHeld:
      type: object
      required: [id, title, at]
      properties:
        id:
          type: string
        title:
          type: string
        at:
          type: string
          format: date-time
    DigestProject:
      type: object
      required: [name, events]
      properties:
        name:
          type: string
        events:
          type: integer
    State:
      type: object
      description: The latest event per key, by kind. A stand-in until stage 12.
      required: [incidents, progress, checkins, statuses]
      properties:
        badge:
          type: integer
          description: |
            The badge count by the badge.scope setting, against the inbox cursor: the
            number the iOS icon, the Mac Dock and the menu bar show. Left out by servers
            before 0.7.
        incidents:
          type: array
          description: Incidents that are not resolved.
          items:
            $ref: "#/components/schemas/Event"
        progress:
          type: array
          description: Progress keys that have not ended.
          items:
            $ref: "#/components/schemas/Event"
        checkins:
          type: array
          description: The last check-in of every known check.
          items:
            $ref: "#/components/schemas/Event"
        statuses:
          type: array
          description: Status keys that are set.
          items:
            $ref: "#/components/schemas/Event"
    Cursor:
      type: object
      required: [cursor]
      properties:
        name:
          type: string
          description: The cursor's name. Set in answers.
        cursor:
          type: string
          description: A list cursor, as next_cursor gives it.
        unread:
          type: integer
          description: |
            Set in answers. The number of events after the cursor that push an alert:
            the Inbox's unread count. A held or store-only event, an incident ack, and
            progress, status and passing check-in events do not count.
        badge:
          type: integer
          description: |
            Set in answers. The badge count by the badge.scope setting: the number the
            iOS icon, the Mac Dock and the menu bar show, and the badge APNs pushes
            carry. attention counts unacknowledged open incidents, checks that are
            down, and unread events at time-sensitive or above; pushed is unread;
            none is 0. badge.projects narrows it. Left out by servers before 0.7, where
            unread was the badge.
    DeviceRegistration:
      type: object
      description: What the app sends to register or refresh a device.
      required: [token, environment, topic]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The APNs device token, hex.
          pattern: "^[0-9A-Fa-f]{32,200}$"
        environment:
          type: string
          enum: [sandbox, production]
          description: The APNs environment the token belongs to. A development build's token is sandbox; TestFlight and App Store tokens are production.
        topic:
          type: string
          description: The app's bundle id, sent as apns-topic.
          minLength: 1
          maxLength: 255
        name:
          type: string
          description: The device's name, as the person sees it.
          maxLength: 128
        platform:
          type: string
          description: Such as iOS or macOS.
          maxLength: 32
        app_version:
          type: string
          description: The app's version and build.
          maxLength: 64
        permissions:
          $ref: "#/components/schemas/Permissions"
        live_activity_token:
          type: string
          description: |
            The push-to-start token ActivityKit gives the app for its Live Activities, hex.
            The server starts an activity on the device with it.
          pattern: "^[0-9A-Fa-f]{32,400}$"
        focus_filter:
          $ref: "#/components/schemas/FocusFilter"
    FocusFilter:
      type: object
      description: |
        The device's Focus filter, as the app's SetFocusFilterIntent reports it. Left out
        of a registration, the stored filter stays: the field is the one exception to
        "every field is replaced". active false clears it. While a filter is set, the
        server lowers this device's pushes above it to active, so the system Focus
        silences them; critical is never lowered. Servers before 0.7 refuse the field
        with 400.
      required: [active]
      additionalProperties: false
      properties:
        active:
          type: boolean
          description: A filter is in force. false clears the stored filter.
        name:
          type: string
          description: The Focus's name, when the app knows it.
          maxLength: 64
        projects:
          type: array
          description: |
            Projects whose events may break through. Empty means every project. An event
            outside them is sent at active at most.
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 128
        break_through:
          type: string
          enum: [time-sensitive, critical]
          description: |
            The lowest level that still breaks through. time-sensitive (the default) lets
            time-sensitive and critical through; critical sends time-sensitive as active.
        updated_at:
          type: string
          format: date-time
          description: When the server stored the filter. Set in answers.
    Permissions:
      type: object
      description: |
        Permission health the app reports. A field left out is unknown. false raises an
        incident with key device:<id>:<field>; true resolves it.
      additionalProperties: false
      properties:
        alerts:
          type: boolean
          description: The person allows notifications that show an alert.
        time_sensitive:
          type: boolean
          description: Time-sensitive notifications are allowed.
        live_activities:
          type: boolean
          description: Live Activities are allowed.
        critical_alerts:
          type: boolean
          description: |
            Critical alerts are allowed. Only a build with the critical-alerts entitlement
            reports it. A device that reports true gets interruption-level critical with
            the critical sound; any other device gets critical as time-sensitive.
    Device:
      type: object
      required: [id, environment, topic, token_suffix, permissions, active, registered_at, updated_at]
      properties:
        id:
          type: string
          description: The server's id for the device.
        environment:
          type: string
          enum: [sandbox, production]
        topic:
          type: string
        token_suffix:
          type: string
          description: The last 8 characters of the APNs token. The full token is never returned.
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        permissions:
          $ref: "#/components/schemas/Permissions"
        active:
          type: boolean
          description: The device gets pushes.
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
          description: When the device stopped getting pushes.
        retired_reason:
          type: string
          description: 'removed, or the APNs reason, such as "apns: Unregistered".'
        live_activity_token_suffix:
          type: string
          description: The last 8 characters of the push-to-start token, when the app reported one.
        focus_filter:
          $ref: "#/components/schemas/FocusFilter"
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    StandbyDevice:
      type: object
      description: A device as a standby server copies it, with the full tokens.
      required: [id, token, environment, topic, permissions, registered_at, updated_at]
      properties:
        id:
          type: string
        token:
          type: string
          description: The APNs device token, lower-case hex.
        environment:
          type: string
          enum: [sandbox, production]
        topic:
          type: string
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        permissions:
          $ref: "#/components/schemas/Permissions"
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
        retired_reason:
          type: string
        live_activity_token:
          type: string
          description: The push-to-start token, when the app reported one.
        focus_filter:
          $ref: "#/components/schemas/FocusFilter"
    StandbyDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/StandbyDevice"
    StandbyImport:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          description: Stored events as the standby's read API returns them, oldest first.
          items:
            type: object
    StandbyImportResult:
      type: object
      required: [imported, skipped, rejected]
      properties:
        imported:
          type: integer
          description: Events stored now.
        skipped:
          type: integer
          description: Events imported before, or whose dedup id was already stored.
        rejected:
          type: integer
          description: Events that are not valid here. The server logs each one and stores none of them.
    Activity:
      type: object
      description: |
        The activity on one progress key. A start, or an update on a key with no running
        activity, begins one; an end, or two hours without an update, ends it.
      required: [key, id, state, source, content, started_at, updated_at, instances]
      properties:
        key:
          type: string
        id:
          type: string
          description: act_ plus the id of the event that began it.
        state:
          type: string
          enum: [active, ended]
        source:
          type: string
        content:
          $ref: "envelope.v1.schema.json#/$defs/LiveContent"
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the sender's last event on the key arrived.
        ended_at:
          type: string
          format: date-time
        end_reason:
          type: string
          enum: [sender, abandoned, restarted]
          description: |
            sender: an end event. abandoned: no update for two hours. restarted: a start
            on the same key began a new activity.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/ActivityInstance"
        timeline:
          type: array
          description: The sender's progress events since the start, oldest first, at most 500. Only on GET /v1/activities/{key}.
          items:
            $ref: "#/components/schemas/TimelineEntry"
    ActivityInstance:
      type: object
      description: |
        The activity on one device. An activity runs as a chain of these: one is ended
        and the next started with the same content before Apple's 8 hour limit.
      required: [id, device, chain, state, requested_at]
      properties:
        id:
          type: string
          description: lai_ plus a ULID. Also in the activity's attributes.
        device:
          type: string
        chain:
          type: integer
          description: 0 for the first link, then 1, 2 and on.
        state:
          type: string
          enum: [starting, active, ended, dismissed, never-started, dead]
          description: |
            starting: push-to-start sent, no update token yet. active: the app reported
            the update token. ended: the server or the system ended it. dismissed: the
            person removed it; never started again. never-started: no update token came
            within 15 minutes; a later update tries again, three times at most. dead:
            APNs refused its update token; never started again.
        end_reason:
          type: string
        requested_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        last_push_at:
          type: string
          format: date-time
    TimelineEntry:
      type: object
      required: [id, received_at, action]
      properties:
        id:
          type: string
          description: The event id.
        received_at:
          type: string
          format: date-time
        action:
          type: string
          enum: [start, update, end]
        content:
          $ref: "envelope.v1.schema.json#/$defs/LiveContent"
    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    InstanceReport:
      type: object
      description: What the app saw. At least one field.
      additionalProperties: false
      properties:
        device:
          type: string
          description: The reporting device's id. When set, it must be the instance's device.
        token:
          type: string
          description: The activity's push token, hex.
          pattern: "^[0-9A-Fa-f]{32,400}$"
        state:
          type: string
          enum: [dismissed, ended]
    MuteInput:
      type: object
      description: A new mute. Give source, key, project, or a mix; an event must match every field given. Give until or for.
      additionalProperties: false
      properties:
        source:
          type: string
          maxLength: 128
          description: Mute events from this source.
        key:
          type: string
          maxLength: 255
          description: Mute events with this key, such as one incident.
        project:
          type: string
          maxLength: 64
          description: Mute every event filed under this project, or under a name the aliases map to it. Folded to lower case. A server before project mutes refuses the field with 400.
        until:
          type: string
          format: date-time
          description: When the mute ends, RFC 3339. In the future, at most 366 days ahead.
        for:
          type: string
          description: How long the mute lasts, a Go duration such as 1h or 90m, instead of until.
        remind:
          type: boolean
          description: Make the mute a snooze. When it ends and the key's incident is still open, the key's last event pushes again at its level. Needs key.
    Mute:
      type: object
      required: [id, until, created_at, active]
      properties:
        id:
          type: string
          description: mute_ plus a ULID.
        source:
          type: string
        key:
          type: string
        project:
          type: string
          description: The project the mute matches, after aliases.
        until:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Set when DELETE ended the mute early.
        active:
          type: boolean
          description: The mute holds back pushes now.
        remind:
          type: boolean
          description: The mute is a snooze. Missing from a server before 0.7.
        reminded_at:
          type: string
          format: date-time
          description: Set on a snooze once the server handled its end, whether or not the key was still open.
    MuteList:
      type: object
      required: [mutes]
      properties:
        mutes:
          type: array
          items:
            $ref: "#/components/schemas/Mute"
    ViewFilter:
      type: object
      description: A saved view's event filter, as the GET /v1/events parameters of the same names. Every field is optional; filters combine with AND.
      additionalProperties: false
      properties:
        project:
          type: array
          maxItems: 32
          description: Events of any of these projects. - means events with no project. Aliases match, as in the project parameter.
          items:
            type: string
            maxLength: 64
        source:
          type: string
          maxLength: 128
        kind:
          $ref: "#/components/schemas/Kind"
        host:
          type: string
          maxLength: 128
        tag:
          type: string
          maxLength: 64
        level:
          type: array
          maxItems: 4
          description: Events at any of these levels.
          items:
            $ref: "#/components/schemas/Level"
        q:
          type: string
          maxLength: 256
          description: Full-text search over title, summary and body.
        routine:
          type: string
          enum: [exclude, only]
          description: exclude leaves routine events out; only keeps only them. Absent keeps both.
    ViewBundle:
      type: object
      description: |
        Fold a burst of the view's pushes into one notification. The first max_visible
        pushes in a window push as usual; each later one in the window replaces one
        collapsed notification, "N new in <view>: <latest title>". Only pushes at level
        active bundle; time-sensitive and critical always push on their own.
      additionalProperties: false
      required: [window]
      properties:
        window:
          type: string
          description: The window from the first push, a Go duration from 1m to 24h, such as 15m.
        max_visible:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: How many pushes in a window push on their own before the rest bundle.
    ViewInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique without regard to case. Not a view_ id.
        filter:
          $ref: "#/components/schemas/ViewFilter"
        bundle:
          $ref: "#/components/schemas/ViewBundle"
        position:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
          description: Sort order in the apps' sidebars, low first.
        icon:
          type: string
          maxLength: 64
          description: An SF Symbol name the apps show, such as externaldrive.
    View:
      type: object
      required: [id, name, filter, position, created_at, updated_at]
      properties:
        id:
          type: string
          description: view_ plus a ULID.
        name:
          type: string
        filter:
          $ref: "#/components/schemas/ViewFilter"
        bundle:
          $ref: "#/components/schemas/ViewBundle"
        position:
          type: integer
        icon:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items:
            $ref: "#/components/schemas/View"
    GuidanceInput:
      type: object
      additionalProperties: false
      required: [scope, text]
      properties:
        scope:
          type: string
          maxLength: 300
          description: global, project:<p>, source:<s> or key:<regex> (a Go regular expression over the event key).
        text:
          type: string
          minLength: 1
          maxLength: 1000
        enabled:
          type: boolean
          default: true
    GuidancePatch:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          maxLength: 300
        text:
          type: string
          minLength: 1
          maxLength: 1000
        enabled:
          type: boolean
    Guidance:
      type: object
      required: [id, scope, text, enabled, version, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          description: gd_ plus a ULID.
        scope:
          type: string
        text:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
          description: Starts at 1; each edit adds one.
        created_by:
          type: string
          description: The name of the token that added it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GuidanceList:
      type: object
      required: [guidance]
      properties:
        guidance:
          type: array
          items:
            $ref: "#/components/schemas/Guidance"
    LlmStatus:
      type: object
      required: [mode, effective_mode, chat, configured, token_set, circuit, tokens_today, tokens_per_day, calls_last_minute, calls_per_minute]
      properties:
        mode:
          type: string
          enum: ["off", shadow, advise, enforce]
          description: llm.mode as set.
        effective_mode:
          type: string
          enum: ["off", shadow, advise, enforce]
          description: |
            The mode in force. off on a standby. shadow until midnight after a budget is
            passed, and while the circuit is open.
        chat:
          type: boolean
          description: Questions are allowed now (llm.chat on, mode not off, not a standby).
        configured:
          type: boolean
          description: llm.base_url and at least one model are set.
        token_set:
          type: boolean
          description: llm.token is set. The token is never returned.
        api:
          type: string
        base_host:
          type: string
          description: The endpoint's host. Never a path or a token.
        chat_model:
          type: string
        decisions_model:
          type: string
        standby:
          type: boolean
        circuit:
          type: string
          enum: [closed, open]
        circuit_until:
          type: string
          format: date-time
          description: When an open circuit closes.
        failures:
          type: integer
          description: Failures in a row; 3 open the circuit for 10 minutes.
        tokens_today:
          type: integer
          format: int64
          description: Tokens in and out since midnight, server time.
        tokens_per_day:
          type: integer
        calls_last_minute:
          type: integer
        calls_per_minute:
          type: integer
        shadow_until:
          type: string
          format: date-time
          description: Set after a budget was passed; the effective mode is at most shadow until then.
        last_error:
          type: string
        last_error_at:
          type: string
          format: date-time
    LlmTest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        model:
          type: string
        answer:
          type: string
          description: The model's reply, at most 200 characters.
        latency_ms:
          type: integer
          format: int64
        call_id:
          type: string
        error:
          type: string
    AskScope:
      type: object
      additionalProperties: false
      description: What the question is about. The server searches this first, and the model may search further.
      properties:
        view:
          type: string
          maxLength: 64
          description: A saved view's id or name.
        project:
          type: string
          maxLength: 64
        key:
          type: string
          maxLength: 255
          description: One incident's or job's key.
        since:
          type: string
          description: RFC 3339 time, or a Go duration back from now such as 12h.
    AskInput:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        scope:
          $ref: "#/components/schemas/AskScope"
    AskAnswer:
      type: object
      required: [answer, cited_ids]
      properties:
        answer:
          type: string
        cited_ids:
          type: array
          description: Ids of events the answer rests on. Every one came back from a tool the server ran.
          items:
            type: string
        proposal:
          $ref: "#/components/schemas/AskProposal"
        call_ids:
          type: array
          description: The llm_calls rows this answer made.
          items:
            type: string
        model:
          type: string
    AskProposal:
      type: object
      required: [type]
      description: |
        A change the model suggests. The server applies nothing. A client shows it and,
        when the owner agrees, applies it with the ordinary write call: filter as
        GET /v1/events parameters, view as POST /v1/views, guidance as POST
        /v1/guidance, mute as POST /v1/mutes. The server checked each body as that call
        would.
      properties:
        type:
          type: string
          enum: [filter, view, guidance, mute]
        summary:
          type: string
          description: One line that says what applying it does.
        filter:
          $ref: "#/components/schemas/ViewFilter"
        view:
          $ref: "#/components/schemas/ViewInput"
        guidance:
          $ref: "#/components/schemas/GuidanceInput"
        mute:
          $ref: "#/components/schemas/MuteInput"
    AttachmentCreated:
      type: object
      required: [id, url, content_type, bytes, sha256]
      properties:
        id:
          type: string
          description: att_ and a ULID. Name it in an event's attachments array.
        url:
          type: string
          description: attachment:<id>, a reference other fields and clients can carry.
        content_type:
          type: string
        bytes:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the body.
    AttachmentInfo:
      $ref: "envelope.v1.schema.json#/$defs/AttachmentInfo"
    IconInfo:
      type: object
      required: [name, content_type, bytes, sha256, updated_at]
      properties:
        name:
          type: string
        content_type:
          type: string
          enum: [image/png, image/jpeg]
        bytes:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the image, also its ETag.
        updated_at:
          type: string
          format: date-time
    IconInfoList:
      type: object
      required: [icons]
      properties:
        icons:
          type: array
          items:
            $ref: "#/components/schemas/IconInfo"
    CheckSchedule:
      type: object
      description: When a check expects pings. Set period_s, or cron with an optional tz, or neither for an unscheduled check that only a failed or overrun run takes down.
      properties:
        period_s:
          type: integer
          minimum: 1
        cron:
          type: string
          maxLength: 128
        tz:
          type: string
          maxLength: 64
          description: IANA time zone for cron. Default UTC.
        grace_s:
          type: integer
          minimum: 0
          description: Seconds a ping may be late before the check goes down. Default 3600.
        max_runtime_s:
          type: integer
          minimum: 1
          description: Seconds a started run may take before the check goes down.
        reminder_s:
          type: integer
          minimum: 0
          description: "Seconds between reminders while the check's incident is open and not acked. Default 86400; 0 sends none."
    CheckConfig:
      type: object
      additionalProperties: false
      properties:
        host:
          type: string
          maxLength: 128
        period_s:
          type: integer
          minimum: 1
        cron:
          type: string
          maxLength: 128
        tz:
          type: string
          maxLength: 64
        grace_s:
          type: integer
          minimum: 0
        max_runtime_s:
          type: integer
          minimum: 1
        reminder_s:
          type: integer
          minimum: 0
    Check:
      type: object
      required: [key, state, state_since, created_at, schedule]
      properties:
        key:
          type: string
          description: The check's slug, the key of its check-in events.
        host:
          type: string
        project:
          type: string
          description: The project of the check's last ping that carried one.
        state:
          type: string
          enum: [new, up, started, late, down, paused]
        state_since:
          type: string
          format: date-time
        down_reason:
          type: string
          enum: [failed, missed, overran]
        schedule:
          $ref: "#/components/schemas/CheckSchedule"
        created_at:
          type: string
          format: date-time
        last_ping:
          type: string
          format: date-time
        last_event:
          type: string
          description: The id of the last check-in event.
        started_at:
          type: string
          format: date-time
          description: The start of the run in progress.
        last_success:
          type: string
          format: date-time
        last_duration_ms:
          type: integer
          description: The last measured run, from a start to its end or as the sender measured it.
        next_due:
          type: string
          format: date-time
          description: When the next ping is due. The check turns late then.
        down_after:
          type: string
          format: date-time
          description: next_due plus the grace, or for a new check its first slot plus the grace. The check goes down then without a ping.
        last_log:
          type: string
          description: The body of the last ping that carried a log.
        last_log_at:
          type: string
          format: date-time
        ping_key_at:
          type: string
          format: date-time
          description: When the check's ping key was minted. Missing when it has none.
        incident:
          type: string
          enum: [open, acked, resolved]
          description: "The state of the check's incident, checkin:<key>. Missing when it never had one."
    PingKey:
      type: object
      required: [key, path]
      properties:
        key:
          type: string
          description: The ping key. Shown once; the server keeps its SHA-256.
        path:
          type: string
          description: The ping path, /p/<key>. Append /start, /fail, /log or an exit code.
    ProjectList:
      type: object
      required: [projects, unfiled]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        unfiled:
          type: integer
          description: The events with no project.
    Project:
      type: object
      required: [name, events, last_at]
      properties:
        name:
          type: string
        events:
          type: integer
          description: The stored events with this project, or a name aliased to it.
        last_at:
          type: string
          format: date-time
          description: When the newest of them arrived.
    CheckList:
      type: object
      required: [checkins]
      properties:
        checkins:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    AppriseNotify:
      type: object
      description: An Apprise API notify request, plus the apprise-tee message fields. Other fields are ignored.
      properties:
        title:
          type: string
        body:
          type: string
          description: Required on /v1/notify; /notify/{key} takes a title alone.
        type:
          type: string
          description: Apprise's type (info, success, warning, failure), kept in details.notify.type.
        tag:
          type: string
          description: The ladder rung, or Apprise tags, comma or space separated (a JSON list works too). Stored as tags; the first picks the level.
        tags:
          type: string
          description: Read when tag is absent. A JSON list works too.
        format:
          type: string
        source:
          type: string
          description: 'The sender. Absent, it comes from a title prefix such as "name: ", else the token name or the client address.'
        project:
          type: string
          description: The event's project. A name the envelope refuses is dropped, not an error.
        level:
          type: string
          description: A rung that replaces tag.
        url:
          type: string
        image:
          type: string
    AppriseAnswer:
      type: object
      required: [error, details]
      properties:
        error:
          type: [string, "null"]
        details:
          type: array
          items:
            type: array
            items: {type: string}
        id: {type: string}
        delivered: {type: boolean}
        hold_id: {type: string}
        backends: {type: object, additionalProperties: true}
    HoldQueue:
      type: object
      required: [mode, held]
      properties:
        mode: {type: string, enum: ["off", shadow, "on"]}
        last_poll_ts: {type: [number, "null"], format: double, description: Epoch seconds.}
        oldest_unforwarded_ts: {type: [number, "null"], format: double, description: "Epoch seconds of the oldest entry that no pushing event carries yet; null when none."}
        deadman_active: {type: boolean}
        held:
          type: array
          items:
            $ref: "#/components/schemas/HoldEntry"
    HoldEntry:
      type: object
      required: [id, ts, deadline_ts, forwarded, shadow, status]
      properties:
        id: {type: string}
        event_id: {type: string}
        ts: {type: number, format: double}
        deadline_ts: {type: number, format: double}
        closed_ts: {type: number, format: double}
        tag: {type: string}
        title: {type: string}
        body: {type: string}
        client: {type: string}
        source: {type: string}
        forwarded: {type: boolean}
        shadow: {type: boolean}
        status: {type: string, enum: [held, released, suppressed, expired]}
        verdict: {type: string}
        reason: {type: string}
    Health:
      type: object
      required: [status, version, db]
      properties:
        status:
          type: string
          enum: [ok, error]
        version:
          type: string
        db:
          type: string
          enum: [ok, error]
          description: Whether the database answered a query.
        events:
          type: integer
          format: int64
          description: The number of stored events. Missing when the database does not answer.
        push:
          type: string
          enum: ["off", "on", "no-key"]
          description: |
            APNs push. off: HERALDO_PUSH is off. on: pushes go out. no-key: HERALDO_PUSH is
            on but no usable APNs key is configured, so nothing is pushed.
        unsent:
          type: integer
          description: |
            With push on: the events received between 24 hours and 15 minutes ago that
            should have pushed an alert and reached no device. APNs refused every device,
            no device is registered, or the push never ran. A monitor alerts when it is
            above 0. Missing when push is not on or the database does not answer.
        llm:
          type: string
          enum: ["off", "on", degraded]
          description: |
            The LLM. off: llm.mode is off, or this is a standby. on: it is in force.
            degraded: it is on, but the circuit is open, a budget was passed, or it is
            not configured. Missing from a server before 0.8.
    SettingInput:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          description: The new value, in the key's JSON type.
    Setting:
      type: object
      required: [key, type, source, secret, description, env]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, string, url, int, duration, clock, tz, enum, list, secret]
          description: |
            duration is a Go duration string above zero, such as "72h". clock is HH:MM.
            tz is an IANA zone name. int is 0 or more. list is an array of strings, and
            a comma-separated list in env vars and flags.
        value:
          description: The value in force. Absent for a secret.
        set:
          type: boolean
          description: A secret only. Whether it has a value.
        source:
          type: string
          enum: [flag, env, db, default]
          description: Where the value in force comes from.
        locked_by:
          type: string
          description: The flag (--llm-mode) or env var that sets the key. While set, writes answer 409.
        default:
          description: The built-in default. Absent for a secret.
        enum:
          type: array
          items:
            type: string
          description: An enum key's values.
        secret:
          type: boolean
        description:
          type: string
        env:
          type: string
          description: The env alias, such as HERALDO_LLM_BASE_URL.
        env_file:
          type: string
          description: A secret only. The env alias that names a file holding it.
        flag:
          type: string
          description: The heraldo-server flag alias, such as --llm-base-url. Absent for a secret.
        updated_at:
          type: string
          format: date-time
          description: When a value was last stored through the API.
        updated_by:
          type: string
          description: The token name that stored it.
        error:
          type: string
          description: Why a stored value is not used, such as a secret that does not decrypt.
    SettingList:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/Setting"
    SettingError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: What went wrong, for a person to read.
        code:
          type: string
          enum: [locked_by_env, no_secret_key]
          description: locked_by_env, a flag or env var sets the key; no_secret_key, the server has no HERALDO_SECRET_KEY_FILE.
        variable:
          type: string
          description: For locked_by_env, the flag or env var that sets the key.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, for a person to read.
