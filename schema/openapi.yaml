openapi: 3.1.0
info:
  title: heraldo
  version: 0.1.0
  description: |
    Notification hub API. Senders post events; the apps and the CLI read them back
    by cursor. The event shape is envelope v1, defined in envelope.v1.schema.json:
    EventInput is what a sender posts, Event is what the read API returns.

    An operation marked `x-stage: <n>` is planned for that stage of the plan and has
    no handler yet.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:7842
    description: A local server on the default port.
security:
  - bearerAuth: []
tags:
  - name: events
  - name: state
  - name: compat
    description: Ingest shapes that existing senders already speak.
  - name: health
  - name: devices
    description: Devices the apps register for push.
  - name: mutes
    description: Hold back pushes for a while. Events are still stored.
  - name: icons
    description: The icon registry. Pushes name an icon; the apps fetch it.
  - name: checkins
    description: Checks that expect pings on a schedule, and the ping API.
  - name: hold
    description: The alert hold, where alert-rung posts wait for triage.
  - name: standby
    description: A standby server copies the devices and hands back what it stored.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check, with the database state.
      tags: [health]
      security: []
      responses:
        "200":
          description: The server is up and the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is up but the database does not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    post:
      operationId: postEvent
      summary: Store one event.
      description: |
        The server assigns id and received_at, and sets ts to the arrival time when it
        is missing. It returns the stored event. An input that sets id, received_at,
        hold or delivery is rejected with 400.

        When the input carries a dedup id seen in the last 24 hours, the server stores
        nothing and returns the first event with 200. For a trusted-ingest token the
        window has no end.
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          $ref: "#/components/responses/Stored"
        "200":
          $ref: "#/components/responses/Repeat"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
    get:
      operationId: listEvents
      summary: List events after a cursor, oldest first.
      description: |
        Clients sync history with this call. Pass the next_cursor from the last page as
        after. An empty page means the client is up to date; keep the last cursor and
        poll with it again later.

        The order is arrival order at this server. An event imported after a client
        synced still appears after that client's cursor.
      tags: [events]
      parameters:
        - name: after
          in: query
          description: Opaque cursor from a previous page. Leave it out to start at the oldest event.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: source
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/Kind"
        - name: host
          in: query
          schema:
            type: string
        - name: key
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: Events that carry this tag.
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search over title, summary and body. Every word must match.
          schema:
            type: string
        - name: before
          in: query
          description: Opaque cursor. Keep only events that arrived before it.
          schema:
            type: string
        - name: order
          in: query
          description: |
            asc lists oldest first; desc lists newest first, and next_cursor is then the
            cursor of the oldest event on the page: pass it as before for the next page.
            The answer's Heraldo-Order header names the order applied.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: hold
          in: query
          description: Events whose hold.state is this value, such as held.
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectFilter"
        - name: routine
          in: query
          description: |
            Routine events are the ones the push table never pushes by kind and action:
            check-ins that did not fail (start, success and log, with no non-zero
            exit_code outside log), and every progress and status event. exclude leaves
            them out; only keeps only them. Without it the list holds both. The filter
            runs in the query, so limit and the cursors stay correct. The answer's
            Heraldo-Routine header names the filter applied. A server before the
            filter ignores the parameter and sends no header.
          schema:
            type: string
            enum: [exclude, only]
      responses:
        "200":
          description: One page of events.
          headers:
            Heraldo-Routine:
              description: The routine filter applied, exclude or only. Absent without one.
              schema:
                type: string
                enum: [exclude, only]
            Heraldo-Order:
              description: The order applied, asc or desc.
              schema:
                type: string
                enum: [asc, desc]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/events/{id}:
    get:
      operationId: getEvent
      summary: Fetch one event with its full body.
      description: The notification service extension calls this to fetch a body that did not fit in the push.
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/send:
    get:
      operationId: sendEvent
      summary: Store one event from query parameters.
      description: |
        The same as POST /v1/events for clients that can only make a GET request,
        such as a URL-only webhook. The query parameters carry the scalar envelope
        fields and tags; actions, content, checkin and details need POST.

        The token may come in the Authorization header or in the token parameter.
        A token in the URL ends up in access logs, proxy logs and browser history;
        use the header when the client can set one. Any other parameter is rejected
        with 400.
      tags: [events]
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/Kind" } }
        - { name: key, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { $ref: "#/components/schemas/EventAction" } }
        - { name: ts, in: query, schema: { type: string, format: date-time } }
        - { name: host, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: summary, in: query, schema: { type: string } }
        - { name: body, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: thread, in: query, schema: { type: string } }
        - { name: url, in: query, schema: { type: string, format: uri } }
        - { name: image, in: query, schema: { type: string, format: uri } }
        - { name: icon, in: query, schema: { type: string } }
        - { name: sound, in: query, schema: { type: string } }
        - name: tags
          in: query
          description: Repeat the parameter for each tag.
          explode: true
          schema:
            type: array
            items:
              type: string
        - { name: dedup, in: query, schema: { type: string } }
        - { name: expires_at, in: query, schema: { type: string, format: date-time } }
        - { name: relevance, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
      responses:
        "201":
          $ref: "#/components/responses/Stored"
        "200":
          $ref: "#/components/responses/Repeat"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/state:
    get:
      operationId: getState
      summary: Current state for the status view.
      description: |
        Flat arrays of the latest event per key: open incidents, running progress,
        check-ins and status values. The shape is a stand-in until stage 12. An
        incident's last event carries the incident's state in its incident field:
        open or acked, with the time it opened.
      tags: [state]
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/stream:
    get:
      operationId: streamEvents
      summary: Server-sent events, one poke per stored event.
      description: |
        Each poke is an SSE event named poke whose data is {"cursor": "..."}, the
        cursor of the newest event. The first poke comes on connect. A poke carries
        no event: the client lists the events after its own cursor. Pokes coalesce, so
        a slow client gets the newest cursor, not every one. A comment line every
        25 seconds keeps the connection alive.
      tags: [events]
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/cursors/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The cursor's name, such as inbox. 1 to 64 of A-Z, a-z, 0-9, dot, underscore and dash.
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    get:
      operationId: getCursor
      summary: The read cursor called name.
      description: |
        A cursor is one unread state, shared by every client that names it: the CLI on
        each machine and the apps read the same inbox. Any read token sees every
        cursor.
      tags: [events]
      responses:
        "200":
          description: The cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cursor"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putCursor
      summary: Move the read cursor called name. Any read token may move it.
      description: |
        A cursor only moves forward. A cursor at or before the stored one changes
        nothing. The answer is the stored cursor. A cursor past the newest event gets
        400.
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: The stored cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cursor"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/devices:
    get:
      operationId: listDevices
      summary: Every registered device, retired ones included, in registration order.
      tags: [devices]
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: registerDevice
      summary: Register a device, or refresh the device that holds this token.
      description: |
        The server knows a device by its APNs token. An unknown token creates a device
        (201) with a new id; the app keeps the id. A known token updates that device
        (200) and makes it active again when it was retired. Every field is replaced:
        a field left out is cleared.

        A permission reported false raises an incident with key
        device:<id>:<permission>; reported true again, it resolves.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: A new device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "200":
          description: The device that holds the token, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The device id the server gave on registration.
        schema:
          type: string
    get:
      operationId: getDevice
      summary: One device.
      tags: [devices]
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateDevice
      summary: Replace a device's registration, such as after APNs gave it a new token.
      description: |
        Every field is replaced, and a retired device becomes active again. A token that
        another device holds gets 409. Permission changes raise or resolve incidents as
        on POST.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "200":
          description: The device, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeDevice
      summary: Stop pushes to a device.
      description: |
        The device is retired with reason removed, not deleted: its delivery history
        stays. Registering its token again brings it back.
      tags: [devices]
      responses:
        "200":
          description: The retired device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/standby/devices:
    get:
      operationId: exportDevices
      summary: Every device with its full push tokens, for a standby server to copy.
      description: |
        Needs an admin token, or a read token with the standby capability. A plain read token
        gets 403: the other device calls show only token suffixes. Retired devices are
        included, so the standby retires them too.
      tags: [standby]
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyDeviceList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/standby/import:
    post:
      operationId: importStandbyEvents
      summary: Store events a standby server stored while this server was unreachable.
      description: |
        Needs an admin token, or a read token with the standby capability. Each event keeps its
        id, received_at and hold. An event id imported before, or a dedup id stored
        before at any age, is skipped, so a repeated import stores nothing twice.
        Imported events are history: they are never pushed and never re-alert.
      tags: [standby]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyImport"
      responses:
        "200":
          description: What the import stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/activities:
    get:
      operationId: listActivities
      summary: Live Activities, one per progress key, in key order.
      description: |
        Without all=1, only the activities that have not ended. Each comes with its
        instances, without the timeline.
      tags: [activities]
      parameters:
        - name: all
          in: query
          description: 1 lists ended activities too.
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: The activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/activities/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The progress key. It may contain slashes.
        schema:
          type: string
    get:
      operationId: getActivity
      summary: The current or last activity on a progress key, with its instances and timeline.
      tags: [activities]
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/activity-instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The instance id from the activity's attributes.
        schema:
          type: string
    put:
      operationId: reportInstance
      summary: The app reports an activity's update token, or that it was dismissed or ended.
      description: |
        Called with the read token, like device registration. A token makes a starting
        instance active, and the server pushes the current content to it at once. A
        state of dismissed means the person removed the activity: the server never
        starts it again on that device. ended means the system ended it; the server
        starts the next one while the activity runs.
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceReport"
      responses:
        "200":
          description: The instance as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityInstance"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /live-activity/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The sender's device id (any text) on a start or a list; the activityId a start answered otherwise.
        schema:
          type: string
      - name: token
        in: query
        required: true
        description: A heraldo write token.
        schema:
          type: string
    post:
      operationId: notifyLiveActivityUpsert
      summary: "Notify! compatibility: start (new=1, or a device id) or update a Live Activity."
      description: |
        The body takes Notify!'s fields: title, body, symbol, tint (hex, alpha first in
        8 digits), progress in percent, steps and step, endsIn in seconds, trailing,
        status, metrics and button {title, url, open}. Null clears a field. heraldo also
        reads project on a start; an update keeps the activity's project. The server
        stores a progress event; docs/api.md, "Notify! compatibility".
      tags: [compat]
      security:
        - tokenQuery: []
      parameters:
        - name: new
          in: query
          schema:
            type: integer
            enum: [1]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "{success, activityId, expiresAt}"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
    delete:
      operationId: notifyLiveActivityEnd
      summary: "Notify! compatibility: end a Live Activity, with final content and keepFor."
      tags: [compat]
      security:
        - tokenQuery: []
      responses:
        "200":
          description: "{success, activityId}. Ending an ended activity succeeds."
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Error"
    get:
      operationId: notifyLiveActivityStatus
      summary: "Notify! compatibility: one activity's state and endReason, or the sender's running activities."
      tags: [compat]
      security:
        - tokenQuery: []
      responses:
        "200":
          description: "{activityId, state, endReason, content, expiresAt}, or {activities: [...]} for a device id."
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Error"
  /link:
    get:
      operationId: notifyLink
      summary: "Notify! compatibility: credential check. Answers {success, type: device, id, name}."
      tags: [compat]
      security:
        - tokenQuery: []
      responses:
        "200":
          description: The token is a write token.
          content:
            application/json:
              schema:
                type: object
  /notify-json/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: notifyJSON
      summary: "Notify! compatibility: a plain notification, stored as a message event."
      description: text is the body, groupType the thread, iconUrl the icon; timeSensitive true is level time-sensitive. heraldo also reads project.
      tags: [compat]
      security:
        - tokenQuery: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "{success, id}"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
  /v1/mutes:
    get:
      operationId: listMutes
      summary: The mutes in force, soonest to end first. Needs a write token.
      tags: [mutes]
      responses:
        "200":
          description: The mutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createMute
      summary: Hold back the pushes of a source, a key, or both, until a time.
      description: |
        A mute holds back pushes only: matching events are stored, listed and
        counted as usual, and their delivery records outcome skipped. Re-alerts are
        held back too. A mute with source and key matches only events with both.
        Give until or for, not both. Needs a write token.
      tags: [mutes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteInput"
      responses:
        "201":
          description: The mute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mute"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/mutes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: endMute
      summary: End a mute now. Needs a write token.
      tags: [mutes]
      responses:
        "200":
          description: The ended mute. A mute that had already ended is returned as it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mute"
