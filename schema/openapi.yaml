        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createView
      summary: Save a view. Needs a write token.
      description: |
        Every client sees the same views. A view with bundle folds a burst of its
        pushes into one notification (docs/api.md, "Saved views").
      tags: [views]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "201":
          description: The view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/views/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The view's id, or its name without regard to case.
        schema:
          type: string
    get:
      operationId: getView
      summary: One saved view.
      tags: [views]
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putView
      summary: Replace a saved view. Needs a write token.
      description: Every field is replaced; a field left out goes back to its default.
      tags: [views]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteView
      summary: Delete a saved view. Needs a write token.
      tags: [views]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/icons:
    get:
      operationId: listIcons
      summary: The icon registry, by name, without the images.
      tags: [icons]
      responses:
        "200":
          description: The icons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconInfoList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/icons/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: 1 to 128 of A-Z a-z 0-9 . _ -, starting with a letter or digit.
        schema:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    get:
      operationId: getIcon
      summary: The icon image.
      description: The ETag is the image's SHA-256; If-None-Match answers 304.
      tags: [icons]
      responses:
        "200":
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The image has not changed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putIcon
      summary: Store or replace an icon. Needs an admin token.
      description: |
        The body is the image: PNG or JPEG, up to 256 KiB. The server checks the
        bytes, not the Content-Type header. A square image of 256 by 256 pixels or
        more shows best.
      tags: [icons]
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: A new icon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconInfo"
        "200":
          description: The icon, replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconInfo"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteIcon
      summary: Remove an icon. Needs an admin token.
      tags: [icons]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/attachments:
    post:
      operationId: createAttachment
      summary: Store a file that an event can then name. Needs a write token.
      description: |
        The body is the file, up to 5 MiB: either the raw bytes with their Content-Type,
        or multipart/form-data with the file in the part called file. Allowed types are
        image/*, text/plain, application/pdf and application/json. A body without a
        type, or sent as application/octet-stream, is typed by its bytes.

        Name the returned id in an event's attachments array. The same bytes uploaded
        twice return the first id. An attachment that no event names within 24 hours
        is deleted. A standby server refuses uploads with 503: an attachment lives on
        the primary only.
      tags: [attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  description: The file's bytes. Its part Content-Type is the type to store.
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: A new attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentCreated"
        "200":
          description: These bytes were stored before; the first attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentCreated"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/attachments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^att_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getAttachment
      summary: The attachment's bytes.
      description: |
        Served with the stored Content-Type, its SHA-256 as the ETag, and headers that
        keep a browser from running it: nosniff and a sandbox CSP.
      tags: [attachments]
      responses:
        "200":
          description: The file.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "304":
          description: The file has not changed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
