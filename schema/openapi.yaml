    get:
      operationId: listIcons
      summary: The icon registry, by name, without the images.
      tags: [icons]
      responses:
        "200":
          description: The icons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconInfoList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/icons/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: 1 to 128 of A-Z a-z 0-9 . _ -, starting with a letter or digit.
        schema:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    get:
      operationId: getIcon
      summary: The icon image.
      description: The ETag is the image's SHA-256; If-None-Match answers 304.
      tags: [icons]
      responses:
        "200":
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The image has not changed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putIcon
      summary: Store or replace an icon. Needs an admin token.
      description: |
        The body is the image: PNG or JPEG, up to 256 KiB. The server checks the
        bytes, not the Content-Type header. A square image of 256 by 256 pixels or
        more shows best.
      tags: [icons]
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: A new icon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconInfo"
        "200":
          description: The icon, replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconInfo"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteIcon
      summary: Remove an icon. Needs an admin token.
      tags: [icons]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
