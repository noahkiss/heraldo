openapi: 3.1.0
info:
  title: heraldo
  version: 0.1.0
  description: |
    Notification hub API. Senders post events; the apps and the CLI read them back
    by cursor. The event shape is envelope v1, defined in envelope.v1.schema.json:
    EventInput is what a sender posts, Event is what the read API returns.

    An operation marked `x-stage: <n>` is planned for that stage of the plan and has
    no handler yet.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:7842
    description: A local server on the default port.
security:
  - bearerAuth: []
tags:
  - name: events
  - name: state
  - name: compat
    description: Ingest shapes that existing senders already speak.
  - name: health
  - name: devices
    description: Devices the apps register for push.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check, with the database state.
      tags: [health]
      security: []
      responses:
        "200":
          description: The server is up and the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is up but the database does not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    post:
      operationId: postEvent
      summary: Store one event.
      description: |
        The server assigns id and received_at, and sets ts to the arrival time when it
        is missing. It returns the stored event. An input that sets id, received_at,
        hold or delivery is rejected with 400.

        When the input carries a dedup id seen in the last 24 hours, the server stores
        nothing and returns the first event with 200. For a trusted-ingest token the
        window has no end.
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          $ref: "#/components/responses/Stored"
        "200":
          $ref: "#/components/responses/Repeat"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
    get:
      operationId: listEvents
      summary: List events after a cursor, oldest first.
      description: |
        Clients sync history with this call. Pass the next_cursor from the last page as
        after. An empty page means the client is up to date; keep the last cursor and
        poll with it again later.

        The order is arrival order at this server. An event imported after a client
        synced still appears after that client's cursor.
      tags: [events]
      parameters:
        - name: after
          in: query
          description: Opaque cursor from a previous page. Leave it out to start at the oldest event.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: source
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/Kind"
        - name: host
          in: query
          schema:
            type: string
        - name: key
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: Events that carry this tag.
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search over title, summary and body. Every word must match.
          schema:
            type: string
        - name: before
          in: query
          description: Opaque cursor. Keep only events that arrived before it.
          schema:
            type: string
        - name: order
          in: query
          description: |
            asc lists oldest first; desc lists newest first, and next_cursor is then the
            cursor of the oldest event on the page: pass it as before for the next page.
            The answer's Heraldo-Order header names the order applied.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: hold
          in: query
          description: Events whose hold.state is this value, such as held.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          headers:
            Heraldo-Order:
              description: The order applied, asc or desc.
              schema:
                type: string
                enum: [asc, desc]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/events/{id}:
    get:
      operationId: getEvent
      summary: Fetch one event with its full body.
      description: The notification service extension calls this to fetch a body that did not fit in the push.
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/send:
    get:
      operationId: sendEvent
      summary: Store one event from query parameters.
      description: |
        The same as POST /v1/events for clients that can only make a GET request,
        such as a URL-only webhook. The query parameters carry the scalar envelope
        fields and tags; actions, content, checkin and details need POST.

        The token may come in the Authorization header or in the token parameter.
        A token in the URL ends up in access logs, proxy logs and browser history;
        use the header when the client can set one. Any other parameter is rejected
        with 400.
      tags: [events]
      security:
        - bearerAuth: []
        - tokenQuery: []
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/Kind" } }
        - { name: key, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { $ref: "#/components/schemas/EventAction" } }
        - { name: ts, in: query, schema: { type: string, format: date-time } }
        - { name: host, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: summary, in: query, schema: { type: string } }
        - { name: body, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: thread, in: query, schema: { type: string } }
        - { name: url, in: query, schema: { type: string, format: uri } }
        - { name: image, in: query, schema: { type: string, format: uri } }
        - { name: icon, in: query, schema: { type: string } }
        - { name: sound, in: query, schema: { type: string } }
        - name: tags
          in: query
          description: Repeat the parameter for each tag.
          explode: true
          schema:
            type: array
            items:
              type: string
        - { name: dedup, in: query, schema: { type: string } }
        - { name: expires_at, in: query, schema: { type: string, format: date-time } }
        - { name: relevance, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
      responses:
        "201":
          $ref: "#/components/responses/Stored"
        "200":
          $ref: "#/components/responses/Repeat"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/state:
    get:
      operationId: getState
      summary: Current state for the status view.
      description: |
        Flat arrays of the latest event per key: open incidents, running progress,
        check-ins and status values. The shape is a stand-in until stage 12. An
        incident's last event shows whether it is acked: its action is ack until a
        later event.
      tags: [state]
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/stream:
    get:
      operationId: streamEvents
      summary: Server-sent events, one poke per stored event.
      description: |
        Each poke is an SSE event named poke whose data is {"cursor": "..."}, the
        cursor of the newest event. The first poke comes on connect. A poke carries
        no event: the client lists the events after its own cursor. Pokes coalesce, so
        a slow client gets the newest cursor, not every one. A comment line every
        25 seconds keeps the connection alive.
      tags: [events]
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/cursors/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The cursor's name, such as inbox. 1 to 64 of A-Z, a-z, 0-9, dot, underscore and dash.
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    get:
      operationId: getCursor
      summary: The read cursor called name.
      description: |
        A cursor is one unread state, shared by every client that names it: the CLI on
        each machine and the apps read the same inbox. Any read token sees every
        cursor.
      tags: [events]
      responses:
        "200":
          description: The cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cursor"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putCursor
      summary: Move the read cursor called name. Any read token may move it.
      description: |
        A cursor only moves forward. A cursor at or before the stored one changes
        nothing. The answer is the stored cursor. A cursor past the newest event gets
        400.
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: The stored cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cursor"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/devices:
    get:
      operationId: listDevices
      summary: Every registered device, retired ones included, in registration order.
      tags: [devices]
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: registerDevice
      summary: Register a device, or refresh the device that holds this token.
      description: |
        The server knows a device by its APNs token. An unknown token creates a device
        (201) with a new id; the app keeps the id. A known token updates that device
        (200) and makes it active again when it was retired. Every field is replaced:
        a field left out is cleared.

        A permission reported false raises an incident with key
        device:<id>:<permission>; reported true again, it resolves.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: A new device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "200":
          description: The device that holds the token, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The device id the server gave on registration.
        schema:
          type: string
    get:
      operationId: getDevice
      summary: One device.
      tags: [devices]
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateDevice
      summary: Replace a device's registration, such as after APNs gave it a new token.
      description: |
        Every field is replaced, and a retired device becomes active again. A token that
        another device holds gets 409. Permission changes raise or resolve incidents as
        on POST.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "200":
          description: The device, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeDevice
      summary: Stop pushes to a device.
      description: |
        The device is retired with reason removed, not deleted: its delivery history
        stays. Registering its token again brings it back.
      tags: [devices]
      responses:
        "200":
          description: The retired device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /ping/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Rid"
      - $ref: "#/components/parameters/Create"
    get:
      operationId: pingSuccess
      summary: Record a successful run (healthchecks.io shape).
      x-stage: 6
      tags: [compat]
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: pingSuccessWithLog
      summary: Record a successful run with a log in the body.
      x-stage: 6
      tags: [compat]
      requestBody:
        $ref: "#/components/requestBodies/PingLog"
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /ping/{slug}/start:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Rid"
      - $ref: "#/components/parameters/Create"
    get:
      operationId: pingStart
      summary: Record the start of a run.
      x-stage: 6
      tags: [compat]
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /ping/{slug}/fail:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Rid"
      - $ref: "#/components/parameters/Create"
    get:
      operationId: pingFail
      summary: Record a failed run.
      x-stage: 6
      tags: [compat]
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: pingFailWithLog
      summary: Record a failed run with a log in the body.
      x-stage: 6
      tags: [compat]
      requestBody:
        $ref: "#/components/requestBodies/PingLog"
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /ping/{slug}/log:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Rid"
      - $ref: "#/components/parameters/Create"
    post:
      operationId: pingLog
      summary: Attach a log line without changing the check's state.
      x-stage: 6
      tags: [compat]
      requestBody:
        $ref: "#/components/requestBodies/PingLog"
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /ping/{slug}/{exit_code}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: exit_code
        in: path
        required: true
        description: The job's exit code. 0 records success, anything else records a failure.
        schema:
          type: integer
          minimum: 0
          maximum: 255
      - $ref: "#/components/parameters/Rid"
      - $ref: "#/components/parameters/Create"
    get:
      operationId: pingExitCode
      summary: Record a run by its exit code.
      x-stage: 6
      tags: [compat]
      responses:
        "200":
          $ref: "#/components/responses/PingOK"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /notify/apprise:
    post:
      operationId: notifyApprise
      summary: Apprise-compatible ingest, stateless form.
      description: |
        Takes an Apprise API notify request and stores it as a message. Answers 200
        with the body "Sent", as the Apprise front door does today.
      x-stage: 11
      tags: [compat]
      requestBody:
        $ref: "#/components/requestBodies/AppriseNotify"
      responses:
        "200":
          $ref: "#/components/responses/AppriseSent"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /notify/{key}:
    post:
      operationId: notifyAppriseKey
      summary: Apprise-compatible ingest for a configuration key.
      description: |
        Takes an Apprise API notify request for a stored configuration key. The key
        selects the sender rules. Answers 200 with the body "Sent".
      x-stage: 11
      tags: [compat]
      parameters:
        - name: key
          in: path
          required: true
          description: The Apprise configuration key.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/AppriseNotify"
      responses:
        "200":
          $ref: "#/components/responses/AppriseSent"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        One token per sender for writes, one per client for reads. An app holds a pair: a
        read token (history, cursors, device registration) and a write token (notification
        actions, sending). Each token has a
        scope: write (POST /v1/events, GET /v1/send), read (GET /v1/events,
        /v1/events/{id}, /v1/state, /v1/stream, the read cursors and /v1/devices), or
        admin (both). A missing or unknown token gets 401; a
        token without the scope gets 403.

        A write token can carry the trusted-ingest capability, for a bridge such as
        apprise-tee. The server copies its details.tee.hold object into hold, marked
        store_only, and matches its dedup ids at any age instead of the last 24 hours.
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: |
        The same token as bearerAuth, in the URL, for GET-only clients. The URL ends up
        in access logs, proxy logs and browser history, so the token does too. Use the
        Authorization header when the client can set one.
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: The check's name, the same as the checkin key.
      schema:
        type: string
    Rid:
      name: rid
      in: query
      description: Run id. Pairs a start with its end.
      schema:
        type: string
    Create:
      name: create
      in: query
      description: Set to 1 to create the check when the server does not know the slug.
      schema:
        type: integer
        enum: [0, 1]
  requestBodies:
    PingLog:
      description: Log text for the run.
      content:
        text/plain:
          schema:
            type: string
    AppriseNotify:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppriseNotify"
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/AppriseNotify"
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Stored:
      description: The event was stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Event"
    Repeat:
      description: The dedup id was seen in the last 24 hours. Nothing was stored; this is the first event.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Event"
    PingOK:
      description: The ping was recorded.
      content:
        text/plain:
          schema:
            type: string
            const: OK
    AppriseSent:
      description: The notification was accepted.
      content:
        text/plain:
          schema:
            type: string
            const: Sent
  schemas:
    EventInput:
      $ref: "envelope.v1.schema.json"
    Event:
      $ref: "envelope.v1.schema.json#/$defs/Event"
    EventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: string
          description: Pass as after to get the next page. Present whenever the page has events; missing on an empty page.
    State:
      type: object
      description: The latest event per key, by kind. A stand-in until stage 12.
      required: [incidents, progress, checkins, statuses]
      properties:
        incidents:
          type: array
          description: Incidents that are not resolved.
          items:
            $ref: "#/components/schemas/Event"
        progress:
          type: array
          description: Progress keys that have not ended.
          items:
            $ref: "#/components/schemas/Event"
        checkins:
          type: array
          description: The last check-in of every known check.
          items:
            $ref: "#/components/schemas/Event"
        statuses:
          type: array
          description: Status keys that are set.
          items:
            $ref: "#/components/schemas/Event"
    Cursor:
      type: object
      required: [cursor]
      properties:
        name:
          type: string
          description: The cursor's name. Set in answers.
        cursor:
          type: string
          description: A list cursor, as next_cursor gives it.
        unread:
          type: integer
          description: |
            Set in answers. The number of events after the cursor that push an alert:
            the app's badge. A held or store-only event, an incident ack, and progress,
            status and passing check-in events do not count.
    DeviceRegistration:
      type: object
      description: What the app sends to register or refresh a device.
      required: [token, environment, topic]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The APNs device token, hex.
          pattern: "^[0-9A-Fa-f]{32,200}$"
        environment:
          type: string
          enum: [sandbox, production]
          description: The APNs environment the token belongs to. A development build's token is sandbox; TestFlight and App Store tokens are production.
        topic:
          type: string
          description: The app's bundle id, sent as apns-topic.
          minLength: 1
          maxLength: 255
        name:
          type: string
          description: The device's name, as the person sees it.
          maxLength: 128
        platform:
          type: string
          description: Such as iOS or macOS.
          maxLength: 32
        app_version:
          type: string
          description: The app's version and build.
          maxLength: 64
        permissions:
          $ref: "#/components/schemas/Permissions"
    Permissions:
      type: object
      description: |
        Permission health the app reports. A field left out is unknown. false raises an
        incident with key device:<id>:<field>; true resolves it.
      additionalProperties: false
      properties:
        alerts:
          type: boolean
          description: The person allows notifications that show an alert.
        time_sensitive:
          type: boolean
          description: Time-sensitive notifications are allowed.
        live_activities:
          type: boolean
          description: Live Activities are allowed.
    Device:
      type: object
      required: [id, environment, topic, token_suffix, permissions, active, registered_at, updated_at]
      properties:
        id:
          type: string
          description: The server's id for the device.
        environment:
          type: string
          enum: [sandbox, production]
        topic:
          type: string
        token_suffix:
          type: string
          description: The last 8 characters of the APNs token. The full token is never returned.
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        permissions:
          $ref: "#/components/schemas/Permissions"
        active:
          type: boolean
          description: The device gets pushes.
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
          description: When the device stopped getting pushes.
        retired_reason:
          type: string
          description: 'removed, or the APNs reason, such as "apns: Unregistered".'
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    AppriseNotify:
      type: object
      description: An Apprise API notify request. Fields heraldo does not use are accepted and ignored.
      required: [body]
      properties:
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [info, success, warning, failure]
          default: info
        tag:
          type: string
          description: Apprise tags, comma or space separated. Stored as tags.
        format:
          type: string
          enum: [text, markdown, html]
    Health:
      type: object
      required: [status, version, db]
      properties:
        status:
          type: string
          enum: [ok, error]
        version:
          type: string
        db:
          type: string
          enum: [ok, error]
          description: Whether the database answered a query.
        events:
          type: integer
          format: int64
          description: The number of stored events. Missing when the database does not answer.
        push:
          type: string
          enum: ["off", "on", "no-key"]
          description: |
            APNs push. off: HERALDO_PUSH is off. on: pushes go out. no-key: HERALDO_PUSH is
            on but no usable APNs key is configured, so nothing is pushed.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, for a person to read.
