# XcodeGen spec. Generate the project with `apple/scripts/generate.sh`.
# Names and bundle IDs live in Config/Names.xcconfig, signing in Config/Local.xcconfig.
# Shared Swift code is the HeraldoKit package. Heraldo is one multiplatform
# target (iOS and macOS); per-platform files sit in App/iOS and App/macOS.
name: Heraldo
options:
  bundleIdPrefix: com.nkmkdigital
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HeraldoKit:
    path: HeraldoKit
targets:
  Heraldo:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Shared
      - path: App/AppIcon.icon
      - path: App/iOS
        excludes: ["*.entitlements", "Info.plist"]
        destinationFilters: [iOS]
      - path: App/macOS
        excludes: ["*.entitlements", "Info.plist"]
        destinationFilters: [macOS]
      # The Live Activity button intent: in the app and the widget extension.
      - path: LiveActivity
        destinationFilters: [iOS]
    dependencies:
      - package: HeraldoKit
        product: HeraldoKit
      - target: HeraldoNotificationService
        embed: true
        codeSign: true
      - target: HeraldoWidgets
        embed: true
        codeSign: true
      - target: HeraldoShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: Heraldo
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        "INFOPLIST_FILE[sdk=iphone*]": App/iOS/Info.plist
        "INFOPLIST_FILE[sdk=macosx*]": App/macOS/Info.plist
        # HERALDO_CRITICAL_ALERTS (Names.xcconfig) picks these; see Base.xcconfig.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": $(APP_IOS_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(APP_MAC_ENTITLEMENTS)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(HERALDO_CRITICAL_SWIFT_CONDITION)"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": $(APP_IOS_PROFILE)
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": $(APP_MAC_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  # iOS: rewrites pushes, updates the widget snapshot. macOS: signals the
  # running app to sync, and rewrites pushes when signed with the app group.
  HeraldoNotificationService:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotificationService
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: HeraldoKit
        product: HeraldoKit
    settings:
      base:
        PRODUCT_NAME: HeraldoNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_NSE_BUNDLE_ID)
        INFOPLIST_FILE: NotificationService/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": NotificationService/NotificationService.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(APP_NSE_MAC_ENTITLEMENTS)
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": $(APP_NSE_IOS_PROFILE)
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": $(APP_NSE_MAC_PROFILE)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]": "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  HeraldoWidgets:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
        excludes: ["*.entitlements", "Info.plist"]
      - path: LiveActivity
        destinationFilters: [iOS]
    dependencies:
      - package: HeraldoKit
        product: HeraldoKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: HeraldoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_WIDGETS_BUNDLE_ID)
        INFOPLIST_FILE: Widgets/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Widgets/Widgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Widgets/WidgetsMac.entitlements
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": $(APP_WIDGETS_IOS_PROFILE)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]": "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  # Share in: the share sheet on iOS and the Share menu on macOS.
  HeraldoShare:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ShareExtension/Shared
      - path: ShareExtension/iOS
        excludes: ["Info.plist"]
        destinationFilters: [iOS]
      - path: ShareExtension/macOS
        excludes: ["Info.plist"]
        destinationFilters: [macOS]
    dependencies:
      - package: HeraldoKit
        product: HeraldoKit
    settings:
      base:
        PRODUCT_NAME: HeraldoShare
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_SHARE_BUNDLE_ID)
        "INFOPLIST_FILE[sdk=iphone*]": ShareExtension/iOS/Info.plist
        "INFOPLIST_FILE[sdk=macosx*]": ShareExtension/macOS/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": ShareExtension/Share.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(APP_SHARE_MAC_ENTITLEMENTS)
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": $(APP_SHARE_IOS_PROFILE)
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": $(APP_SHARE_MAC_PROFILE)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]": "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  Heraldo:
    build:
      targets:
        Heraldo: all
    run:
      config: Debug
    archive:
      config: Release
