# Example heraldo ingest rules. Set HERALDO_RULES to the file's path; the
# server reloads it within 5 s of a change. docs/api.md, "Ingest rules", has
# the format. Try a change on a catalogue before you deploy it:
#   heraldo-server replay-tee -rules rules.yaml <catalogue-dir>
rules:
  # A daily summary: stored and listed, never a push of its own (a digest
  # is passive, so inbox-only).
  - name: nightly-digest
    match: {title: '^Nightly report \d{4}-\d{2}-\d{2}'}
    set: {kind: digest, level: passive, thread: reports}

  # A watchdog's failure opens an incident; its recovery resolves the same
  # key. Both rules must build the key the same way.
  - name: unit-failed
    match:
      title: '^(?P<host>[\w.-]+): \d+ unit\(s\) failed'
      body: '^(?P<unit>[^\s,]+)'
    set: {kind: incident, action: open, key: 'unit:{host}:{unit}', host: '{host}', thread: units}
  # A host that stops answering is urgent: time-sensitive, pushed again
  # every 15 minutes until someone acks it or it recovers.
  - name: host-down
    match: {title: '^(?P<host>[\w.-]+) is down$'}
    set: {kind: incident, action: open, key: 'host:{host}', host: '{host}', level: time-sensitive, realert: 15m}
  - name: host-up
    match: {title: '^(?P<host>[\w.-]+) is up$'}
    set: {kind: incident, action: resolve, key: 'host:{host}', host: '{host}', level: passive}
  - name: unit-recovered
    match:
      title: '^(?P<host>[\w.-]+): \d+ unit\(s\) recovered'
      body: '^(?P<unit>[^\s,]+)'
    set: {kind: incident, action: resolve, key: 'unit:{host}:{unit}', host: '{host}', level: passive, thread: units}

  # A scheduled job's reports as check-ins.
  - name: job-ok
    match: {title: '^job (?P<job>[\w-]+) ok$'}
    set: {kind: checkin, action: success, key: 'job:{job}', level: passive}
  - name: job-failed
    match: {title: '^job (?P<job>[\w-]+) failed$'}
    set: {kind: checkin, action: fail, key: 'job:{job}'}

  # A ping rule: it names kind in match, so it sees the check-in events of
  # /ping and /p only. It keeps their kind, key and action. Here one check's
  # failed runs are held for triage: stored, listed under ?hold=held, never
  # pushed. The check still goes down.
  - name: offsite-backup-triage
    match: {kind: '^checkin$', key: '^offsite-backup$', action: '^fail$'}
    set: {hold: true, thread: triage}

  # An emergency: the ops rung opens a critical incident. A rule's critical
  # needs no token capability, since the owner writes this file. It breaks
  # through Focus on a device that allows critical alerts, and escalates to
  # Pushover when escalation is on; an ack in heraldo cancels that.
  - name: ops-emergency
    match: {tag: '^ops$', title: '^(?P<what>.+)$'}
    set: {kind: incident, action: open, key: 'ops:{what}', level: critical}

  # Everything at the quiet rung stays a message in the inbox, with no
  # notification.
  - name: quiet-message
    match: {tag: '^quiet$'}
    set: {kind: message, level: passive}

# While a host is down, its units' incidents are stored but not pushed.
inhibit:
  - name: host-down
    parent: '^host:(?P<host>[\w.-]+)$'
    children: '^unit:{host}:'

# File events under a project when the sender named none. This runs on every
# input after the rules, typed senders and pings included. The first match
# wins. An event with a key and no project takes its key's project.
projects:
  - match: {source: '^printer-'}
    project: printing
  - match: {thread: '^units$'}
    project: fleet

# An old project name stored as its new one; a filter on the new name also
# matches events stored under the old.
aliases:
  infra: fleet
