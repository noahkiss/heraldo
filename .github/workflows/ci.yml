# Go gate: gofmt, generated code up to date, vet, tests. Then, on a push to
# main or a v* tag, build the server image and push it to GHCR (amd64 only).
# Pull requests run the gate only.
# On a v* tag it then dispatches the Homebrew tap's bump.yml and waits for the
# verified bump. That needs the repo secret HOMEBREW_TAP_TOKEN (a PAT with
# `workflow` scope on the tap): this repo's GITHUB_TOKEN cannot dispatch another.
# apple/ is not built in CI yet. Run apple/scripts/check.sh locally instead.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**', 'apple/**', 'design/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'apple/**', 'design/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    permissions:
      contents: read
    uses: noahkiss/workflows/.github/workflows/go-ci.yml@main
    with:
      go-version-file: .go-version
      generate-check: true

  image:
    needs: go
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: noahkiss/workflows/.github/workflows/ghcr-build-push.yml@main
    with:
      image: ghcr.io/noahkiss/heraldo
      platforms: linux/amd64
      build_args: |
        VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
      smoke_command: docker run --rm "$IMAGE" version

  bump-tap:
    needs: image
    if: github.ref_type == 'tag'
    uses: noahkiss/workflows/.github/workflows/dispatch-and-wait.yml@main
    with:
      repo: noahkiss/homebrew-tap
      workflow: bump.yml
      inputs_json: ${{ format('{{"formula":"heraldo","tag":"{0}"}}', github.ref_name) }}
      timeout_minutes: 45
    secrets:
      token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
